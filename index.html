<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReedUp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">ReedUp</div>
    <div id="patientLine" class="patient-line"></div>
    <nav id="nav" aria-label="Vues">
      <button data-view="today">Aujourd'hui</button>
      <button data-view="week">Semaine</button>
      <button data-view="month">Mois</button>
      <button data-view="report">Bilan</button>
      <button data-view="program">Programme</button>
      <button data-view="kine">Vue kiné</button>
    </nav>
  </header>

  <!-- Chaque vue est dessinée ici par JavaScript -->
  <main id="main"></main>

  <footer class="foot">
    Prototype pédagogique, données fictives. ReedUp n'est pas un dispositif médical
    et ne donne aucun avis médical.
    <button id="resetBtn" class="link">Réinitialiser la démo</button>
  </footer>

  <dialog id="dialog"></dialog>
  <div id="toast" role="status"></div>

  <!-- L'ordre compte : chaque fichier utilise les précédents -->
  <script src="js/dates.js"></script>
  <script src="js/data.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/biosensor.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/vues-patient.js"></script>
  <script src="js/bilan.js"></script>
  <script src="js/programme.js"></script>
  <script src="js/kine.js"></script>
  <script src="app.js"></script>
</body>
</html>
